<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="540" height="960">
  <!-- DiviRush Play screen sample (flat cartoon, portrait 1080x1920). Episode 1 Easy Level 1, item 4 of 10. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#4361EE"/>
    </linearGradient>
    <style>
      .ink { stroke: #1B1B3A; stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; }
      .txt { font-family: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', 'Segoe UI', sans-serif; font-weight: 700; fill: #1B1B3A; }
      .wtxt { font-family: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', 'Segoe UI', sans-serif; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background: sky gradient with floating bubbles -->
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity="0.18">
    <circle cx="120" cy="420" r="60"/>
    <circle cx="960" cy="560" r="90"/>
    <circle cx="880" cy="1180" r="40"/>
    <circle cx="160" cy="1480" r="75"/>
    <circle cx="560" cy="1820" r="55"/>
    <circle cx="70" cy="980" r="28"/>
    <circle cx="1010" cy="1650" r="34"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.35">
    <circle cx="300" cy="1700" r="30"/>
    <circle cx="820" cy="300" r="24"/>
    <circle cx="980" cy="880" r="18"/>
  </g>

  <!-- Top bar: back button, level label, score -->
  <g>
    <rect class="ink" x="40" y="60" width="120" height="120" rx="36" fill="#FFFFFF"/>
    <path class="ink" d="M115 92 L80 120 L115 148" fill="none"/>
    <rect class="ink" x="190" y="60" width="520" height="120" rx="60" fill="#FFFFFF"/>
    <text class="txt" x="450" y="112" font-size="34" text-anchor="middle">EPISODE 1 · EASY FACTS</text>
    <text class="txt" x="450" y="156" font-size="30" text-anchor="middle" fill="#4361EE">Easy · Level 1</text>
    <rect class="ink" x="740" y="60" width="300" height="120" rx="60" fill="#FFD166"/>
    <text class="txt" x="890" y="138" font-size="52" text-anchor="middle">★ 145</text>
  </g>

  <!-- Item progress dots: 3 done, 1 current, 6 to go -->
  <g transform="translate(540 250)">
    <g class="ink" stroke-width="6">
      <circle cx="-315" cy="0" r="22" fill="#06D6A0"/>
      <circle cx="-245" cy="0" r="22" fill="#06D6A0"/>
      <circle cx="-175" cy="0" r="22" fill="#EF476F"/>
      <circle cx="-105" cy="0" r="28" fill="#FFFFFF"/>
      <circle cx="-35" cy="0" r="22" fill="#1B1B3A" fill-opacity="0.25"/>
      <circle cx="35" cy="0" r="22" fill="#1B1B3A" fill-opacity="0.25"/>
      <circle cx="105" cy="0" r="22" fill="#1B1B3A" fill-opacity="0.25"/>
      <circle cx="175" cy="0" r="22" fill="#1B1B3A" fill-opacity="0.25"/>
      <circle cx="245" cy="0" r="22" fill="#1B1B3A" fill-opacity="0.25"/>
      <circle cx="315" cy="0" r="22" fill="#1B1B3A" fill-opacity="0.25"/>
    </g>
    <text class="wtxt" x="0" y="80" font-size="34" text-anchor="middle">Item 4 of 10</text>
  </g>

  <!-- Timer bar: 15 s Easy timer, 10 s left (green) -->
  <g>
    <rect class="ink" x="90" y="380" width="900" height="64" rx="32" fill="#1B1B3A" fill-opacity="0.35"/>
    <rect x="100" y="390" width="590" height="44" rx="22" fill="#06D6A0"/>
    <rect x="120" y="398" width="300" height="10" rx="5" fill="#FFFFFF" opacity="0.5"/>
    <text class="wtxt" x="990" y="500" font-size="40" text-anchor="end">⏱ 10 s</text>
  </g>

  <!-- Streak badge -->
  <g transform="translate(130 520) rotate(-8)">
    <rect class="ink" x="0" y="0" width="300" height="96" rx="48" fill="#EF476F"/>
    <text class="wtxt" x="150" y="66" font-size="46" text-anchor="middle">×3 Streak!</text>
  </g>

  <!-- Item card: 56 ÷ 8 = ? -->
  <g>
    <rect class="ink" x="110" y="690" width="860" height="400" rx="70" fill="#FFFFFF"/>
    <rect x="140" y="1030" width="800" height="30" rx="15" fill="#4361EE" opacity="0.12"/>
    <text class="txt" x="540" y="950" font-size="190" text-anchor="middle">56 ÷ 8</text>
    <text class="txt" x="540" y="1040" font-size="54" text-anchor="middle" fill="#4361EE">= ?</text>
  </g>

  <!-- Answer bubbles (Easy: 3 bubbles, wrong answers far off) -->
  <g>
    <!-- Bubble 7 (correct) -->
    <circle class="ink" cx="240" cy="1400" r="150" fill="#FFD166"/>
    <path d="M160 1330 A110 110 0 0 1 250 1280" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.8"/>
    <circle cx="300" cy="1300" r="12" fill="#FFFFFF" opacity="0.8"/>
    <text class="txt" x="240" y="1450" font-size="140" text-anchor="middle">7</text>

    <!-- Bubble 2 -->
    <circle class="ink" cx="540" cy="1560" r="150" fill="#06D6A0"/>
    <path d="M460 1490 A110 110 0 0 1 550 1440" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.8"/>
    <circle cx="600" cy="1460" r="12" fill="#FFFFFF" opacity="0.8"/>
    <text class="txt" x="540" y="1610" font-size="140" text-anchor="middle">2</text>

    <!-- Bubble 15 -->
    <circle class="ink" cx="840" cy="1400" r="150" fill="#EF476F"/>
    <path d="M760 1330 A110 110 0 0 1 850 1280" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.8"/>
    <circle cx="900" cy="1300" r="12" fill="#FFFFFF" opacity="0.8"/>
    <text class="txt" x="840" y="1450" font-size="130" text-anchor="middle">15</text>
  </g>

  <!-- Hint line -->
  <text class="wtxt" x="540" y="1830" font-size="38" text-anchor="middle" opacity="0.9">Tap the right bubble!</text>
</svg>
